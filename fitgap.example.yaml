# fitgap configuration — copy to fitgap.yaml and edit.
# fitgap.yaml is gitignored so client-specific settings stay local.

# Active LLM provider/model — set with `fitgap model use <provider>/<model>`.
# The provider choice is a per-engagement compliance decision; API keys are
# never stored here (env var / OS keyring / gitignored .env — see README).
llm:
  provider: anthropic
  model: claude-sonnet-4-6

# Anonymisation rules applied before any text is sent to an external API.
redact_file: redact.yaml

# rapidfuzz similarity (50-100) above which two requirements are merged.
dedupe_threshold: 90

ado:
  organization: ""          # e.g. contoso
  project: ""               # e.g. CRM-Replacement
  pat_env_var: AZURE_DEVOPS_PAT
  area_path: null           # e.g. CRM-Replacement\Requirements
  # wiql: optional full WIQL override

verify:
  mode: mcp                 # mcp | web_search (both restricted to learn.microsoft.com)
  # Verification dominates run cost: the model researches Learn once per claim
  # and the server-side tool loop re-sends everything fetched so far on every
  # round. Measure any change with `fitgap benchmark-verify` — it reports cost
  # AND how many claims still confirm, so you can see functionality loss.
  cache_prompt: true        # cache system prompt + tool defs across calls. Free win.
  # search_only: true       # expose microsoft_docs_search but NOT microsoft_docs_fetch,
                            # which pulls whole Learn pages into context. Much cheaper;
                            # excerpts may miss PREVIEW/DEPRECATED banners.
  # model: claude-haiku-4-5 # cheaper model for verification only. The URL liveness
                            # guard still rejects fabricated citations.
  max_searches: 5           # web_search mode only: searches allowed per claim

output:
  workspace: fitgap_workspace/requirements.json
  register: fitgap_workspace/fitgap_register.xlsx

# Saved Excel column mappings (written automatically on first ingest of a file).
xlsx_mappings: {}
