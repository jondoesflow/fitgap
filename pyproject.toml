[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitgap"
version = "0.1.0"
description = "Fit-gap analysis assistant for Dynamics 365 CE / Power Platform consultants"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fitgap = "fitgap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
